services:
  - type: web
    name: gatherly-event-platform
    runtime: node
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Ananya
      - key: ADMIN_EMAIL
        value: ananya@example.com
      - key: ADMIN_PHONE
        value: 9999999999
      - key: ADMIN_PASSWORD
        sync: false
